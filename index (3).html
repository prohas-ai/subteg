<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Трекер подписок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>tailwind.config = { darkMode: 'class' }</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html, body, #root { height: 100%; }
  body { margin: 0; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  @keyframes up { from { transform: translateY(100%); } to { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .sheet { animation: up .3s cubic-bezier(.2,.8,.2,1); }
  .fade { animation: fade .2s ease; }
  .pop { animation: pop .25s ease both; }
  .no-sb::-webkit-scrollbar { display: none; }
  button { transition: transform .12s ease, opacity .12s ease; }
  button:active { transform: scale(.97); }
</style>
</head>
<body class="bg-slate-50 dark:bg-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;
// Иконки Lucide (те же SVG-пути, что и в lucide-react), встроены без внешних зависимостей
const ICONS = {
  Plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  Trash2: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>',
  Pencil: '<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/>',
  Crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/>',
  BarChart3: '<path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  List: '<line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/>',
  X: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  Check: '<path d="M20 6 9 17l-5-5"/>',
  Sparkles: '<path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>',
  Lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  Infinity: '<path d="M12 12c-2-2.67-4-4-6-4a4 4 0 1 0 0 8c2 0 4-1.33 6-4Zm0 0c2 2.67 4 4 6 4a4 4 0 0 0 0-8c-2 0-4 1.33-6 4Z"/>',
  Bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  ArrowUpDown: '<path d="m21 16-4 4-4-4"/><path d="M17 20V4"/><path d="m3 8 4-4 4 4"/><path d="M7 4v16"/>',
  PieChart: '<path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/>',
  CalendarClock: '<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/>',
  Wallet: '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
};
const mkIcon = name => ({ size = 24, strokeWidth = 2, className = '', color = 'currentColor' }) => (
  <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
    strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round" className={className}
    dangerouslySetInnerHTML={{ __html: ICONS[name] }} />
);
const [Plus, Trash2, Pencil, Crown, BarChart3, List, X, Check, Sparkles, Lock, InfIcon, Bell, ArrowUpDown, PieChart, CalendarClock, Wallet] =
  ['Plus', 'Trash2', 'Pencil', 'Crown', 'BarChart3', 'List', 'X', 'Check', 'Sparkles', 'Lock', 'Infinity', 'Bell', 'ArrowUpDown', 'PieChart', 'CalendarClock', 'Wallet'].map(mkIcon);

const tg = window.Telegram && window.Telegram.WebApp;
const FREE_LIMIT = 3;
const CATEGORIES = ['Развлечения', 'Сервисы', 'Связь', 'Другое'];
const CAT_COLORS = { 'Развлечения': '#8b5cf6', 'Сервисы': '#3b82f6', 'Связь': '#10b981', 'Другое': '#f59e0b' };
const COLORS = ['#f5c400', '#2aabee', '#ff6a00', '#0077ff', '#6b7280', '#21a038', '#ef4444', '#a855f7'];
const TEMPLATES = [
  { name: 'Яндекс Плюс', amount: 299, color: '#f5c400', category: 'Развлечения' },
  { name: 'Telegram Premium', amount: 299, color: '#2aabee', category: 'Сервисы' },
  { name: 'Кинопоиск', amount: 299, color: '#ff6a00', category: 'Развлечения' },
  { name: 'VK Музыка', amount: 249, color: '#0077ff', category: 'Развлечения' },
  { name: 'iCloud', amount: 59, color: '#6b7280', category: 'Сервисы' },
  { name: 'СберПрайм', amount: 399, color: '#21a038', category: 'Сервисы' },
];

const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => new Date(s + 'T00:00:00');
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
const money = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const haptic = (t = 'light') => { try { tg && tg.HapticFeedback.impactOccurred(t); } catch (e) {} };

// ближайшая дата списания (автоперенос, если дата уже прошла)
function nextCharge(s) {
  let d = parse(s.next), t = today(), g = 0;
  while (d < t && g++ < 600) s.period === 'year' ? d.setFullYear(d.getFullYear() + 1) : d.setMonth(d.getMonth() + 1);
  return d;
}
const daysLeft = s => Math.round((nextCharge(s) - today()) / 864e5);
function plural(n, a, b, c) { const m = n % 100, k = n % 10; return m > 10 && m < 15 ? c : k === 1 ? a : k > 1 && k < 5 ? b : c; }
function countdown(n) {
  if (n === 0) return 'Списание сегодня';
  if (n === 1) return 'Списание завтра';
  return `Списание через ${n} ${plural(n, 'день', 'дня', 'дней')}`;
}
const monthly = s => s.period === 'year' ? s.amount / 12 : s.amount;

function load(key, def) { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function save(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }

const Logo = ({ s, size = 44 }) => (
  <div className="flex items-center justify-center rounded-2xl text-white font-bold shrink-0 shadow-sm"
    style={{ width: size, height: size, background: s.color, fontSize: size * 0.42 }}>
    {(s.name || '?').trim().charAt(0).toUpperCase()}
  </div>
);

function Sheet({ onClose, children, center }) {
  return (
    <div className={`fixed inset-0 z-50 flex ${center ? 'items-center p-4' : 'items-end'} justify-center`}>
      <div className="fade absolute inset-0 bg-black/50" onClick={onClose} />
      <div className={`${center ? 'pop rounded-3xl' : 'sheet rounded-t-3xl'} relative w-full max-w-md max-h-[92vh] overflow-y-auto bg-white dark:bg-slate-800 text-slate-900 dark:text-slate-100 shadow-2xl`}
        style={{ paddingBottom: center ? 0 : 'env(safe-area-inset-bottom, 0px)' }}>
        {children}
      </div>
    </div>
  );
}

function SubForm({ initial, onSave, onClose }) {
  const editing = !!initial;
  const blank = { name: '', amount: '', period: 'month', next: iso(new Date(Date.now() + 7 * 864e5)), category: 'Развлечения', color: COLORS[1] };
  const [f, setF] = useState(initial ? { ...initial, amount: String(initial.amount) } : blank);
  const set = (k, v) => setF(p => ({ ...p, [k]: v }));
  const valid = f.name.trim() && Number(f.amount) > 0 && f.next;
  const inp = 'w-full rounded-xl bg-slate-100 dark:bg-slate-700/60 px-4 py-3 text-base outline-none focus:ring-2 focus:ring-indigo-500';
  const lbl = 'block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1.5 ml-1';
  return (
    <Sheet onClose={onClose}>
      <div className="p-5">
        <div className="flex items-center justify-between mb-4">
          <h2 className="text-xl font-bold">{editing ? 'Редактирование' : 'Новая подписка'}</h2>
          <button onClick={onClose} className="p-2 rounded-full bg-slate-100 dark:bg-slate-700"><X size={18} /></button>
        </div>

        {!editing && (
          <div className="mb-5">
            <div className={lbl}>Популярные сервисы</div>
            <div className="flex gap-2 overflow-x-auto no-sb -mx-5 px-5 pb-1">
              {TEMPLATES.map(t => (
                <button key={t.name} onClick={() => { haptic(); setF(p => ({ ...p, ...t, amount: String(t.amount), period: 'month' })); }}
                  className="flex items-center gap-2 shrink-0 rounded-2xl bg-slate-100 dark:bg-slate-700/60 pl-1.5 pr-3.5 py-1.5">
                  <Logo s={t} size={30} />
                  <span className="text-sm font-medium whitespace-nowrap">{t.name}</span>
                </button>
              ))}
              <button onClick={() => { haptic(); setF(blank); }}
                className="flex items-center gap-1.5 shrink-0 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-600 px-3.5 py-2 text-sm font-medium text-slate-600 dark:text-slate-300">
                <Sparkles size={15} /> Своя подписка
              </button>
            </div>
          </div>
        )}

        <div className="space-y-4">
          <div><label className={lbl}>Название</label>
            <input className={inp} value={f.name} onChange={e => set('name', e.target.value)} placeholder="Например, Кинопоиск" /></div>
          <div><label className={lbl}>Сумма, ₽</label>
            <input className={inp} type="number" inputMode="decimal" value={f.amount} onChange={e => set('amount', e.target.value)} placeholder="299" /></div>
          <div><label className={lbl}>Период оплаты</label>
            <div className="grid grid-cols-2 gap-1 p-1 rounded-xl bg-slate-100 dark:bg-slate-700/60">
              {[['month', 'Ежемесячно'], ['year', 'Ежегодно']].map(([v, l]) => (
                <button key={v} onClick={() => set('period', v)}
                  className={`py-2.5 rounded-lg text-sm font-medium ${f.period === v ? 'bg-white dark:bg-slate-600 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}>{l}</button>
              ))}
            </div></div>
          <div><label className={lbl}>Дата следующего списания</label>
            <input className={inp} type="date" value={f.next} onChange={e => set('next', e.target.value)} /></div>
          <div><label className={lbl}>Категория</label>
            <div className="flex flex-wrap gap-2">
              {CATEGORIES.map(c => (
                <button key={c} onClick={() => set('category', c)}
                  className={`px-3.5 py-2 rounded-full text-sm font-medium ${f.category === c ? 'bg-indigo-600 text-white' : 'bg-slate-100 dark:bg-slate-700/60'}`}>{c}</button>
              ))}
            </div></div>
          <div><label className={lbl}>Цвет</label>
            <div className="flex gap-2.5 flex-wrap">
              {COLORS.map(c => (
                <button key={c} onClick={() => set('color', c)} style={{ background: c }}
                  className="w-8 h-8 rounded-full flex items-center justify-center">
                  {f.color === c && <Check size={16} color="#fff" strokeWidth={3} />}
                </button>
              ))}
            </div></div>
        </div>

        <button disabled={!valid} onClick={() => onSave({ ...f, name: f.name.trim(), amount: Number(f.amount) })}
          className="mt-6 w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold text-base disabled:opacity-40">
          {editing ? 'Сохранить' : 'Добавить подписку'}
        </button>
      </div>
    </Sheet>
  );
}

function Paywall({ onClose, onDemo, onBuy }) {
  const feats = [[InfIcon, 'Безлимит подписок', 'Добавляйте сколько угодно сервисов'], [PieChart, 'Аналитика по категориям', 'Понятно, куда уходят деньги'], [Bell, 'Гибкие уведомления', 'Напомним заранее — за день или за неделю']];
  return (
    <Sheet onClose={onClose} center>
      <div className="relative">
        <div className="bg-gradient-to-br from-indigo-600 via-violet-600 to-fuchsia-600 text-white px-6 pt-8 pb-7 text-center rounded-t-3xl">
          <button onClick={onClose} className="absolute top-3 right-3 p-2 rounded-full bg-white/20"><X size={18} /></button>
          <div className="mx-auto w-16 h-16 rounded-2xl bg-white/20 flex items-center justify-center mb-3"><Crown size={32} /></div>
          <h2 className="text-2xl font-bold">Подписки без границ</h2>
          <p className="text-white/80 text-sm mt-1">В бесплатной версии — до {FREE_LIMIT} подписок. Откройте всё с PRO.</p>
        </div>
        <div className="p-5">
          <div className="space-y-3.5">
            {feats.map(([I, t, d]) => (
              <div key={t} className="flex gap-3 items-center">
                <div className="w-10 h-10 rounded-xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 flex items-center justify-center shrink-0"><I size={20} /></div>
                <div><div className="font-semibold text-[15px]">{t}</div><div className="text-sm text-slate-500 dark:text-slate-400">{d}</div></div>
              </div>
            ))}
          </div>
          <div className="mt-5 space-y-2.5">
            <button onClick={() => onBuy('99 ₽ / месяц')} className="w-full py-3.5 rounded-2xl bg-indigo-600 text-white font-semibold">99 ₽ / месяц</button>
            <button onClick={() => onBuy('499 ₽ / навсегда')} className="w-full py-3.5 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-semibold">
              499 ₽ / навсегда <span className="ml-1 text-xs font-medium opacity-70">выгоднее</span></button>
            <button onClick={onDemo} className="w-full py-3 rounded-2xl border-2 border-dashed border-slate-300 dark:border-slate-600 text-sm font-medium text-slate-600 dark:text-slate-300">
              Активировать демо-PRO</button>
          </div>
        </div>
      </div>
    </Sheet>
  );
}

function Analytics({ subs, pro, openPaywall }) {
  const data = useMemo(() => {
    const m = {}; subs.forEach(s => { m[s.category] = (m[s.category] || 0) + monthly(s); });
    return Object.entries(m).map(([k, v]) => ({ k, v })).sort((a, b) => b.v - a.v);
  }, [subs]);
  const total = data.reduce((a, b) => a + b.v, 0);

  if (!pro) return (
    <div className="pop text-center py-14 px-6">
      <div className="mx-auto w-16 h-16 rounded-2xl bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-300 flex items-center justify-center mb-4"><Lock size={28} /></div>
      <h3 className="text-lg font-bold">Аналитика доступна в PRO</h3>
      <p className="text-slate-500 dark:text-slate-400 text-sm mt-1.5 mb-5">Узнайте, на что уходит большая часть бюджета.</p>
      <button onClick={openPaywall} className="px-6 py-3 rounded-2xl bg-indigo-600 text-white font-semibold">Перейти на PRO</button>
    </div>
  );
  if (!subs.length) return <div className="text-center text-slate-500 py-16 text-sm">Добавьте подписки — и здесь появится аналитика</div>;

  const R = 52, C = 2 * Math.PI * R; let off = 0;
  return (
    <div className="pop space-y-4">
      <div className="rounded-3xl bg-white dark:bg-slate-800 p-5 shadow-sm flex items-center gap-5">
        <svg viewBox="0 0 140 140" className="w-36 h-36 shrink-0 -rotate-90">
          <circle cx="70" cy="70" r={R} fill="none" strokeWidth="18" className="stroke-slate-100 dark:stroke-slate-700" />
          {data.map(d => { const len = (d.v / total) * C; const el = (
            <circle key={d.k} cx="70" cy="70" r={R} fill="none" strokeWidth="18" stroke={CAT_COLORS[d.k]}
              strokeDasharray={`${Math.max(len - 2, 0)} ${C}`} strokeDashoffset={-off} style={{ transition: 'all .6s ease' }} />); off += len; return el; })}
        </svg>
        <div className="min-w-0">
          <div className="text-xs text-slate-500 dark:text-slate-400">В месяц</div>
          <div className="text-2xl font-bold">{money(total)}</div>
          <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">{money(total * 12)} в год</div>
        </div>
      </div>
      <div className="rounded-3xl bg-white dark:bg-slate-800 p-5 shadow-sm space-y-4">
        {data.map(d => (
          <div key={d.k}>
            <div className="flex justify-between text-sm mb-1.5">
              <span className="flex items-center gap-2 font-medium"><i className="w-2.5 h-2.5 rounded-full" style={{ background: CAT_COLORS[d.k] }} />{d.k}</span>
              <span className="text-slate-500 dark:text-slate-400">{money(d.v)} · {Math.round(d.v / total * 100)}%</span>
            </div>
            <div className="h-2 rounded-full bg-slate-100 dark:bg-slate-700 overflow-hidden">
              <div className="h-full rounded-full" style={{ width: `${d.v / total * 100}%`, background: CAT_COLORS[d.k], transition: 'width .6s ease' }} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function App() {
  const [subs, setSubs] = useState(() => load('subs_v1', []));
  const [pro, setPro] = useState(() => load('pro_v1', false));
  const [tab, setTab] = useState('list');
  const [sort, setSort] = useState('date');
  const [form, setForm] = useState(null);      // null | {sub?}
  const [paywall, setPaywall] = useState(false);
  const [toast, setToast] = useState('');

  useEffect(() => save('subs_v1', subs), [subs]);
  useEffect(() => save('pro_v1', pro), [pro]);
  useEffect(() => {
    const apply = () => {
      const dark = tg && tg.colorScheme ? tg.colorScheme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
    };
    apply();
    if (tg) { tg.ready(); tg.expand(); tg.onEvent('themeChanged', apply); }
    const mq = window.matchMedia('(prefers-color-scheme: dark)'); mq.addEventListener && mq.addEventListener('change', apply);
  }, []);
  useEffect(() => { if (toast) { const t = setTimeout(() => setToast(''), 2500); return () => clearTimeout(t); } }, [toast]);

  const mTotal = subs.reduce((a, s) => a + monthly(s), 0);
  const sorted = useMemo(() => [...subs].sort((a, b) => sort === 'date' ? nextCharge(a) - nextCharge(b) : monthly(b) - monthly(a)), [subs, sort]);

  const tryAdd = () => { haptic(); (!pro && subs.length >= FREE_LIMIT) ? setPaywall(true) : setForm({}); };
  const onSave = data => {
    if (form.sub) setSubs(p => p.map(s => s.id === form.sub.id ? { ...s, ...data } : s));
    else setSubs(p => [...p, { ...data, id: Date.now() }]);
    haptic('medium'); setForm(null); setToast(form.sub ? 'Изменения сохранены' : 'Подписка добавлена');
  };
  const remove = s => {
    const go = ok => { if (ok) { setSubs(p => p.filter(x => x.id !== s.id)); setToast('Подписка удалена'); } };
    tg && tg.showConfirm ? tg.showConfirm(`Удалить «${s.name}»?`, go) : go(window.confirm(`Удалить «${s.name}»?`));
  };
  const demo = () => { setPro(true); setPaywall(false); haptic('medium'); setToast('Демо-PRO активирован 🎉'); };

  const used = Math.min(subs.length, FREE_LIMIT);

  return (
    <div className="min-h-full text-slate-900 dark:text-slate-100 max-w-md mx-auto" style={{ paddingTop: 'env(safe-area-inset-top, 0px)', paddingBottom: 'calc(84px + env(safe-area-inset-bottom, 0px))' }}>
      <div className="px-4 pt-4">
        {/* Дашборд */}
        <div className="pop rounded-3xl bg-gradient-to-br from-indigo-600 via-violet-600 to-purple-700 text-white p-5 shadow-lg shadow-indigo-500/20">
          <div className="flex items-center justify-between">
            <span className="text-sm text-white/80 flex items-center gap-1.5"><Wallet size={15} /> Расходы в месяц</span>
            {pro && <span className="text-[11px] font-bold bg-white/20 px-2 py-0.5 rounded-full flex items-center gap-1"><Crown size={11} /> PRO</span>}
          </div>
          <div className="text-4xl font-extrabold mt-1 tracking-tight">{money(mTotal)}</div>
          <div className="text-sm text-white/80 mt-1">Прогноз на год: <b className="text-white">{money(mTotal * 12)}</b></div>

          <div className="mt-5 rounded-2xl bg-white/15 p-3.5">
            {pro ? (
              <div className="flex items-center justify-between text-sm">
                <span className="flex items-center gap-2"><InfIcon size={18} /> Безлимит подписок активен</span>
                <button onClick={() => { setPro(false); setToast('Демо-PRO отключён'); }} className="text-xs underline text-white/80">Отключить</button>
              </div>
            ) : (
              <>
                <div className="flex items-center justify-between text-sm mb-2">
                  <span>Использовано {used} из {FREE_LIMIT} бесплатных</span>
                  <button onClick={() => setPaywall(true)} className="text-xs font-bold bg-white text-indigo-700 px-3 py-1.5 rounded-full flex items-center gap-1"><Crown size={12} /> Перейти на PRO</button>
                </div>
                <div className="h-2 rounded-full bg-white/25 overflow-hidden">
                  <div className="h-full rounded-full bg-white" style={{ width: `${used / FREE_LIMIT * 100}%`, transition: 'width .5s ease' }} />
                </div>
              </>
            )}
          </div>
        </div>

        {tab === 'list' ? (
          <div className="mt-5">
            <div className="flex items-center justify-between mb-3 px-1">
              <h2 className="font-bold text-lg">Мои подписки</h2>
              <div className="flex p-0.5 rounded-xl bg-slate-200/70 dark:bg-slate-800 text-xs font-medium">
                {[['date', 'По дате', CalendarClock], ['price', 'По цене', ArrowUpDown]].map(([v, l, I]) => (
                  <button key={v} onClick={() => setSort(v)} className={`px-3 py-1.5 rounded-[10px] flex items-center gap-1 ${sort === v ? 'bg-white dark:bg-slate-600 shadow-sm' : 'text-slate-500 dark:text-slate-400'}`}><I size={12} />{l}</button>
                ))}
              </div>
            </div>

            {!sorted.length && (
              <div className="pop text-center py-12 px-6 rounded-3xl bg-white dark:bg-slate-800 shadow-sm">
                <div className="text-5xl mb-3">🧾</div>
                <div className="font-semibold">Пока пусто</div>
                <div className="text-sm text-slate-500 dark:text-slate-400 mt-1">Добавьте первую подписку, чтобы не пропустить списание</div>
              </div>
            )}

            <div className="space-y-2.5">
              {sorted.map((s, i) => {
                const n = daysLeft(s);
                return (
                  <div key={s.id} className="pop rounded-2xl bg-white dark:bg-slate-800 p-3.5 shadow-sm flex items-center gap-3" style={{ animationDelay: `${i * 40}ms` }}>
                    <Logo s={s} />
                    <div className="min-w-0 flex-1">
                      <div className="font-semibold truncate">{s.name}</div>
                      <div className={`text-xs mt-0.5 ${n <= 3 ? 'text-rose-500 font-medium' : 'text-slate-500 dark:text-slate-400'}`}>{countdown(n)}</div>
                      <div className="text-[11px] text-slate-400 mt-0.5">{s.category}</div>
                    </div>
                    <div className="text-right shrink-0">
                      <div className="font-bold">{money(s.amount)}</div>
                      <div className="text-[11px] text-slate-500 dark:text-slate-400">{s.period === 'year' ? 'раз в год' : 'раз в месяц'}</div>
                      <div className="flex gap-1 justify-end mt-1.5">
                        <button onClick={() => setForm({ sub: s })} className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300"><Pencil size={14} /></button>
                        <button onClick={() => remove(s)} className="p-1.5 rounded-lg bg-rose-50 dark:bg-rose-500/15 text-rose-500"><Trash2 size={14} /></button>
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        ) : (
          <div className="mt-5">
            <h2 className="font-bold text-lg mb-3 px-1">Аналитика</h2>
            <Analytics subs={subs} pro={pro} openPaywall={() => setPaywall(true)} />
          </div>
        )}
      </div>

      {/* Нижняя панель */}
      <div className="fixed bottom-0 inset-x-0 z-40 bg-white/85 dark:bg-slate-900/85 backdrop-blur border-t border-slate-200 dark:border-slate-800"
        style={{ paddingBottom: 'env(safe-area-inset-bottom, 0px)' }}>
        <div className="max-w-md mx-auto flex items-center justify-around h-[68px] px-4">
          <button onClick={() => setTab('list')} className={`flex flex-col items-center gap-0.5 text-xs font-medium w-20 ${tab === 'list' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}><List size={22} />Подписки</button>
          <button onClick={tryAdd} className="-mt-6 w-14 h-14 rounded-full bg-indigo-600 text-white flex items-center justify-center shadow-lg shadow-indigo-500/40"><Plus size={28} /></button>
          <button onClick={() => setTab('stats')} className={`flex flex-col items-center gap-0.5 text-xs font-medium w-20 ${tab === 'stats' ? 'text-indigo-600 dark:text-indigo-400' : 'text-slate-400'}`}>
            <span className="relative"><BarChart3 size={22} />{!pro && <Lock size={10} className="absolute -top-1 -right-2" />}</span>Аналитика</button>
        </div>
      </div>

      {form && <SubForm initial={form.sub} onSave={onSave} onClose={() => setForm(null)} />}
      {paywall && <Paywall onClose={() => setPaywall(false)} onDemo={demo} onBuy={p => setToast(`Тариф «${p}»: подключите оплату на бэкенде`)} />}
      {toast && <div className="pop fixed left-1/2 -translate-x-1/2 bottom-24 z-[60] px-4 py-2.5 rounded-full bg-slate-900 dark:bg-white text-white dark:text-slate-900 text-sm font-medium shadow-xl whitespace-nowrap">{toast}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
